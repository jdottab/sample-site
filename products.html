<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="./style/style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    </head>
    <body onload="ListProducts()">
        <section class="products">
            <header>
                <div class="header-content flex-item">
                    <div class="logo"></div>
                    <nav>
                        <a href="./main.html"><button>Home</button></a>
                        <a href="./about.html"><button>About</button></a>
                        <a href="./contact.html"><button>Contact</button></a>
                        <a href="./learn.html"><button>Learn</button></a>
                        <a href="./shop.html"><button>Shop</button></a>
                    </nav>
                </div>
            </header>
            <main>
                <h1 class="h header-txt">Products</h1>
                <div class="product-items grid-container">
                </div>
                <div class="flex-item flex-column" id="cart">
                    <button type="button" class="cart-toggle" id="toggle">
                        <img src="./assets/cart_bitmap.svg" alt="cart svg">
                    </button>
                    <div class="cart" id="cart-container">
                        <div class="cart-items" id="cart-items" aria-placeholder="Nothing here..yet!">
                        </div>
                        <div class="cart-total">
                            <h5>Total: $<span class="total"></span></h5>
                        </div>
                        <div class="checkout">
                            <button type="button"><a href="./checkout.html">Checkout</a></button>
                        </div>
                    </div>
                </div>
            </main>
        </section>
        <script src="./index.js"></script>
    </body>
</html>
